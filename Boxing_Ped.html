<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>สนามมวยแบบเป็ดๆ</title>
  <link rel="shortcut icon" href="#">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background-color: #000; }
    canvas { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
</head>
<body>
<script>
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();


  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 4, 8);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.target.set(0, 1, 0);

  const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/abandoned_workshop_1k.exr';
  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  pmremGenerator.compileEquirectangularShader();

  new THREE.EXRLoader()
      .setDataType(THREE.UnsignedByteType)
      .load(exrSkyboxUrl, (texture) => {
          const skybox = pmremGenerator.fromEquirectangular(texture).texture;
          scene.background = skybox;
          scene.environment = skybox;

          texture.dispose();
          pmremGenerator.dispose();
      }, undefined, (error) => {
          console.error('Unable to load EXR skybox:', error);
      });

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 10, 5);
  dirLight.castShadow = true;
  scene.add(dirLight);

  const arenaSpotlight = new THREE.SpotLight(0xffffff, 4.0);
  arenaSpotlight.position.set(0, 10, 0);
  arenaSpotlight.angle = Math.PI / 3;
  arenaSpotlight.penumbra = 0.4;
  arenaSpotlight.decay = 1.5;
  arenaSpotlight.distance = 30;
  arenaSpotlight.castShadow = true;
  scene.add(arenaSpotlight);

  arenaSpotlight.target.position.set(0, 0, 0);
  scene.add(arenaSpotlight.target);

  let clickableTextObjects = [];

  const loader = new THREE.GLTFLoader();
  loader.load('Boxing_Ped.glb', (gltf) => {
    const model = gltf.scene;
    
    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
        if (child.material) {
          child.material.needsUpdate = true;
        }
        const meshName = child.name.toLowerCase();
        if (meshName.includes('text') || meshName.includes('portfolio') || meshName.includes('font') || meshName.includes('string')) {
          clickableTextObjects.push(child);
        }
      }
    });


    if (clickableTextObjects.length === 0) {
      model.traverse((child) => {
        if (child.isMesh && !child.name.toLowerCase().includes('ring') && !child.name.toLowerCase().includes('stage')) {
          clickableTextObjects.push(child);
        }
      });
    }

    model.position.set(0, 0, 0);
    scene.add(model);
    console.log('Boxing_Ped.glb');
  }, undefined, (err) => {
    console.error('Boxing_Ped.glb error', err);
  });

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  addEventListener('click', (event) => {
    mouse.x = (event.clientX / innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    
    const intersects = raycaster.intersectObjects(clickableTextObjects, true);

    if (intersects.length > 0) {
      const clicked = intersects[0].object;
      console.log('คลิกโดนตัวอักษร:', clicked.name);

      clicked.scale.multiplyScalar(1.2);
      setTimeout(() => {
        clicked.scale.divideScalar(1.2);
      }, 200);
    }
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  });

 function animate() {
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
</script>
</body>
</html>
