<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>สนามมวยแบบเป็ดๆ</title>
  <link rel="shortcut icon" href="#">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background-color: #000; }
    canvas { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<script>
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050505);

  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
  camera.position.set(0, 5, 10);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

 
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  
  const arenaSpotlight = new THREE.SpotLight(0xffffff, 8.0);
  arenaSpotlight.position.set(0, 10, 0);
  arenaSpotlight.angle = Math.PI / 4;
  arenaSpotlight.penumbra = 0.5;
  arenaSpotlight.castShadow = true;
  arenaSpotlight.shadow.mapSize.width = 2048;
  arenaSpotlight.shadow.mapSize.height = 2048;
  arenaSpotlight.shadow.bias = -0.0001;
  scene.add(arenaSpotlight);

  arenaSpotlight.target.position.set(0, 0, 0);
  scene.add(arenaSpotlight.target);

  let clickableTextObjects = [];
  let mixer;
  const clock = new THREE.Clock();

  const loader = new THREE.GLTFLoader();
  loader.load('Boxing_Ped.glb', (gltf) => {
    const model = gltf.scene;


    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());

  
    model.position.x += (model.position.x - center.x);
    model.position.y += (model.position.y - center.y);
    model.position.z += (model.position.z - center.z);

  
    const maxDim = Math.max(size.x, size.y, size.z);
    const fov = camera.fov * (Math.PI / 180);
    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 2.5;

    if (cameraZ < 5) cameraZ = 5;

    camera.position.set(0, maxDim * 0.8, cameraZ);
    camera.lookAt(0, 0, 0);
    controls.target.set(0, 0, 0);
    controls.update();


    arenaSpotlight.position.set(0, maxDim * 2, 0);

    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;

        const meshName = child.name.toLowerCase();
        if (meshName.includes('text') || meshName.includes('portfolio') || meshName.includes('font') || meshName.includes('string')) {
          clickableTextObjects.push(child);
        }
      }
    });

    if (clickableTextObjects.length === 0) {
      model.traverse((child) => {
        if (child.isMesh && !child.name.toLowerCase().includes('ring') && !child.name.toLowerCase().includes('stage')) {
          clickableTextObjects.push(child);
        }
      });
    }

    scene.add(model);

    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(model);
      gltf.animations.forEach((clip) => {
        const action = mixer.clipAction(clip);
        action.setLoop(THREE.LoopRepeat, Infinity);
        action.play();
      });
    }
  });


  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  window.addEventListener('mousemove', (event) => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(clickableTextObjects, true);

    if (intersects.length > 0) {
      document.body.style.cursor = 'pointer';
    } else {
      document.body.style.cursor = 'default';
    }
  });

  window.addEventListener('click', (event) => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(clickableTextObjects, true);

    if (intersects.length > 0) {
      const clickedMesh = intersects[0].object;
      console.log('คลิกโดนวัตถุชื่อ:', clickedMesh.name);

      const originalScale = clickedMesh.scale.clone();
      clickedMesh.scale.multiplyScalar(1.25);
      
      setTimeout(() => {
        clickedMesh.scale.copy(originalScale);
      }, 150);

      const name = clickedMesh.name.toLowerCase();
      if (name.includes('portfolio')) {
        alert('เปิดหน้าผลงาน Portfolio');
      } else if (name.includes('about')) {
        alert('เปิดหน้าเกี่ยวกับฉัน');
      }
    }
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  });

  function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();
    if (mixer) {
      mixer.update(delta);
    }

    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
