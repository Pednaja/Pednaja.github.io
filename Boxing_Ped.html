<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>สนามมวยแบบเป็ดๆ</title>
  <link rel="shortcut icon" href="#">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background-color: #000; }
    canvas { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<script>
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020202);

  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
  camera.position.set(0, 4, 8);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(0, 1.0, 0);
  controls.update();

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambientLight);

  const arenaSpotlight = new THREE.SpotLight(0xffffff, 12.0);
  arenaSpotlight.position.set(0, 6.5, 0);       
  arenaSpotlight.angle = Math.PI / 4.5;         
  arenaSpotlight.penumbra = 0.5;
  arenaSpotlight.decay = 1.0;
  arenaSpotlight.distance = 30;
  arenaSpotlight.castShadow = true;

  arenaSpotlight.shadow.mapSize.width = 2048;
  arenaSpotlight.shadow.mapSize.height = 2048;
  arenaSpotlight.shadow.bias = -0.0001;

  scene.add(arenaSpotlight);

  arenaSpotlight.target.position.set(0, 0.8, 0);
  scene.add(arenaSpotlight.target);

  let allObjects = [];
  let mixer;
  const clock = new THREE.Clock();

  const loader = new THREE.GLTFLoader();
  loader.load('Boxing_Ped.glb', (gltf) => {
    const model = gltf.scene;
    
    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
        if (child.material) {
          child.material.needsUpdate = true;
        }
        allObjects.push(child);
      }
    });

    model.position.set(0, 0, 0);
    scene.add(model);

    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(model);
      gltf.animations.forEach((clip) => {
        const action = mixer.clipAction(clip);
        action.setLoop(THREE.LoopRepeat, Infinity);
        action.play();
      });
    }
  });

  let targetCameraPosition = camera.position.clone();
  let targetControlCenter = controls.target.clone();
  let isZooming = false;

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  window.addEventListener('mousemove', (event) => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(allObjects, true);

    if (intersects.length > 0) {
      document.body.style.cursor = 'pointer';
    } else {
      document.body.style.cursor = 'default';
    }
  });

  window.addEventListener('click', (event) => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(allObjects, true);

    if (intersects.length > 0) {
      targetCameraPosition.set(0, 2.2, 1.8);  
      targetControlCenter.set(0, 0.8, 0);    
      isZooming = true;
    }
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  });

  function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();
    if (mixer) {
      mixer.update(delta);
    }

    if (isZooming) {
      camera.position.lerp(targetCameraPosition, 0.05);
      controls.target.lerp(targetControlCenter, 0.05);

      if (camera.position.distanceTo(targetCameraPosition) < 0.01) {
        isZooming = false;
      }
    }

    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
