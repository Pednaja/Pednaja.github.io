<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>สนามมวยแบบเป็ดๆ</title>
  <link rel="shortcut icon" href="#">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background-color: #000; }
    canvas { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<script>
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);


  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 1.8, 5.5);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(0, 1.2, 0);
  
  controls.enableZoom = true;
  controls.enableRotate = true;
  controls.enablePan = true;
  controls.update();

  const arenaSpotlight = new THREE.SpotLight(0xffffff, 8.0); 
  arenaSpotlight.position.set(0, 8, 0); 
  arenaSpotlight.angle = Math.PI / 4;  
  arenaSpotlight.penumbra = 0.3;       
  arenaSpotlight.decay = 1.2;
  arenaSpotlight.distance = 25;
  arenaSpotlight.castShadow = true;
  

  arenaSpotlight.shadow.mapSize.width = 2048;
  arenaSpotlight.shadow.mapSize.height = 2048;
  scene.add(arenaSpotlight);

  arenaSpotlight.target.position.set(0, 0, 0);
  scene.add(arenaSpotlight.target);


  let clickableTextObjects = [];
  let mixer;
  const clock = new THREE.Clock();

  const loader = new THREE.GLTFLoader();
  loader.load('Boxing_Ped.glb', (gltf) => {
    const model = gltf.scene;
    
    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
        if (child.material) {
          child.material.needsUpdate = true;
        }

        const meshName = child.name.toLowerCase();
        if (meshName.includes('text') || meshName.includes('portfolio') || meshName.includes('font') || meshName.includes('string')) {
          clickableTextObjects.push(child);
        }
      }
    });

    if (clickableTextObjects.length === 0) {
      model.traverse((child) => {
        if (child.isMesh && !child.name.toLowerCase().includes('ring') && !child.name.toLowerCase().includes('stage')) {
          clickableTextObjects.push(child);
        }
      });
    }

    model.position.set(0, 0, 0);
    scene.add(model);

    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(model);
      gltf.animations.forEach((clip) => {
        const action = mixer.clipAction(clip);
        action.setLoop(THREE.LoopRepeat); 
        action.play();
      });
    
    }

  });

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  addEventListener('click', (event) => {
    mouse.x = (event.clientX / innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(clickableTextObjects, true);

    if (intersects.length > 0) {
      const clicked = intersects[0].object;
      console.log('คลิกโดนตัวอักษร:', clicked.name);

      clicked.scale.multiplyScalar(1.2);
      setTimeout(() => {
        clicked.scale.divideScalar(1.2);
      }, 200);
    }
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  });


  function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();
    if (mixer) {
      mixer.update(delta); 
    }

    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
